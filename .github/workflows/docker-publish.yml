name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read application version
        id: appver
        run: echo "version=$(grep -oP '__version__\s*=\s*\"\K[^\"]+' stash_jellyfin_proxy/__init__.py)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=7.3.10,enable={{is_default_branch}}
          # Without an explicit `labels`, metadata-action emits its own
          # org.opencontainers.* set, and build-push-action's `labels:`
          # below OVERRIDES the Dockerfile's — so `LABEL version` in the
          # Dockerfile was silently replaced by the ref name ("main"),
          # leaving a stale/meaningless image identity. Deployment's
          # freshness check reads that label, so it must carry the real
          # application version. Read it from the single source of truth
          # rather than duplicating the string a third time.
          labels: |
            org.opencontainers.image.version=${{ steps.appver.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Copy package to build context
        run: cp -r stash_jellyfin_proxy build_docker/

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./build_docker
          file: ./build_docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
